workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - setup
  - lint
  - test
  - burn-in
  - report

variables:
  GIT_DEPTH: 0
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

cache:
  key:
    files:
      - projects/frontend/bun.lock
      - projects/go.sum
  paths:
    - .cache/ms-playwright/
    - projects/frontend/node_modules/
    - ~/.bun/install/cache/
    - ~/.cache/go-build/
    - ~/go/pkg/mod/
    - ~/go/bin/

# Setup stage
generate:bindings:
  stage: setup
  image: golang:1.25
  script:
    - export PATH=$PATH:$(go env GOPATH)/bin
    - which wails || go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
    - cd projects
    - wails generate module
  artifacts:
    paths:
      - projects/frontend/wailsjs/
    expire_in: 1 day

# Lint stage
lint:backend:
  stage: lint
  image: golang:1.25
  script:
    - cd projects
    - mkdir -p frontend/dist && touch frontend/dist/.gitkeep
    - go vet ./...

lint:frontend:
  stage: lint
  image: oven/bun:1
  needs:
    - generate:bindings
  script:
    - cd projects/frontend
    - bun install --frozen-lockfile
    - bun run lint

# Test stage
test:backend:
  stage: test
  image: golang:1.25
  needs:
    - lint:backend
  script:
    - cd projects
    - mkdir -p frontend/dist && touch frontend/dist/.gitkeep
    - go test -v -coverprofile=coverage.out ./...
  artifacts:
    when: always
    paths:
      - projects/coverage.out
      - projects/test-results/
    expire_in: 30 days

test:frontend:unit:
  stage: test
  image: oven/bun:1
  needs:
    - lint:frontend
    - generate:bindings
  script:
    - cd projects/frontend
    - bun install --frozen-lockfile
    - bun run test

.frontend-e2e-template: &frontend-e2e-template
  stage: test
  image: oven/bun:1
  needs:
    - lint:frontend
    - generate:bindings
  before_script:
    - cd projects/frontend
    - bun install --frozen-lockfile
    - bunx playwright install --with-deps chromium
  artifacts:
    when: always
    paths:
      - projects/frontend/test-results/
      - projects/frontend/playwright-report/
    expire_in: 30 days
  timeout: 30 minutes

test:frontend:e2e:shard-1:
  <<: *frontend-e2e-template
  script:
    - bun run test:e2e -- --shard=1/2
    - test -f test-results/nfr-performance-metrics.json
    - cp test-results/nfr-performance-metrics.json test-results/nfr-performance-metrics-shard-1.json
    - cp test-results/nfr-performance-summary.md test-results/nfr-performance-summary-shard-1.md
  after_script:
    - if [ -f projects/frontend/test-results/nfr-performance-metrics.json ]; then cp projects/frontend/test-results/nfr-performance-metrics.json projects/frontend/test-results/nfr-performance-metrics-shard-1.json; fi
    - if [ -f projects/frontend/test-results/nfr-performance-summary.md ]; then cp projects/frontend/test-results/nfr-performance-summary.md projects/frontend/test-results/nfr-performance-summary-shard-1.md; fi

test:frontend:e2e:shard-2:
  <<: *frontend-e2e-template
  script:
    - bun run test:e2e -- --shard=2/2
    - test -f test-results/nfr-performance-metrics.json
    - cp test-results/nfr-performance-metrics.json test-results/nfr-performance-metrics-shard-2.json
    - cp test-results/nfr-performance-summary.md test-results/nfr-performance-summary-shard-2.md
  after_script:
    - if [ -f projects/frontend/test-results/nfr-performance-metrics.json ]; then cp projects/frontend/test-results/nfr-performance-metrics.json projects/frontend/test-results/nfr-performance-metrics-shard-2.json; fi
    - if [ -f projects/frontend/test-results/nfr-performance-summary.md ]; then cp projects/frontend/test-results/nfr-performance-summary.md projects/frontend/test-results/nfr-performance-summary-shard-2.md; fi

# Burn-in stage
burn-in:frontend:
  stage: burn-in
  image: oven/bun:1
  needs:
    - test:frontend:e2e:shard-1
    - test:frontend:e2e:shard-2
    - generate:bindings
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - export DEBIAN_FRONTEND=noninteractive && apt-get update -qq && apt-get install -y --no-install-recommends git
    - git fetch origin develop:develop || true
    - cd projects/frontend
    - bun install --frozen-lockfile
    - bunx playwright install --with-deps chromium
  script:
    - echo "🔥 Starting burn-in loop using @seontechnologies/playwright-utils"
    - bun run scripts/burn-in-changed.ts
  artifacts:
    when: always
    paths:
      - projects/frontend/test-results/
      - projects/frontend/playwright-report/
    expire_in: 30 days
  timeout: 60 minutes

report:
  stage: report
  image: alpine:latest
  needs:
    - test:backend
    - test:frontend:unit
    - test:frontend:e2e:shard-1
    - test:frontend:e2e:shard-2
  when: always
  script:
    - echo "## Test Execution & NFR Performance Summary"
    - if [ -f projects/test-results/backend-nfr-metrics.json ]; then echo "### Backend NFR Metrics"; cat projects/test-results/backend-nfr-metrics.json; fi
    - if [ -f projects/frontend/test-results/nfr-performance-summary-shard-1.md ]; then echo "### Frontend E2E Shard 1 NFR Summary"; cat projects/frontend/test-results/nfr-performance-summary-shard-1.md; fi
    - if [ -f projects/frontend/test-results/nfr-performance-summary-shard-2.md ]; then echo "### Frontend E2E Shard 2 NFR Summary"; cat projects/frontend/test-results/nfr-performance-summary-shard-2.md; fi
    - echo "View detailed results in job artifacts"
  artifacts:
    when: always
    paths:
      - projects/test-results/
      - projects/frontend/test-results/
    expire_in: 30 days

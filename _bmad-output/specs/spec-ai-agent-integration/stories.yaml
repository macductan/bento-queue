- id: "1"
  title: "Self-Healing Storage Index, Single-Walk GetTree, Path/Name Selector Resolver & Wails-Free ConfigService"
  description: >-
    Tách phụ thuộc wailsRuntime khỏi ConfigService (CAP-1), nâng cấp FileSystem.FindByUUID tự chữa lành khi file/folder bị xóa/di chuyển từ bên ngoài và loại bỏ lượt quét đĩa lặp thứ hai trong CollectionService.GetTree (CAP-5).
    Bổ sung bộ phân giải định danh thực thể (Collection, Environment, Folder, Request) theo cả UUID lẫn đường dẫn phân cấp tên phục vụ CLI (CAP-4).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    1. Trong projects/service/config.go: xóa import github.com/wailsapp/wails/v2/pkg/runtime; thêm trường onStartupError func(ctx context.Context, message string) và phương thức SetStartupErrorHandler vào ConfigService; cập nhật projects/app.go đăng ký callback runtime.EventsEmit(ctx, "startup-error", msg); bổ sung hỗ trợ biến môi trường HECTO_CONFIG_DIR và phương thức SetCustomConfigDir(dir string) để CLI và test có thể chỉ định thư mục cấu hình/dữ liệu độc lập.
    2. Trong projects/storage/filesystem.go: sửa FindByUUID(uuid string) kiểm tra f.Exists(path) && (strings.HasSuffix(path, ".json") || f.Exists(filepath.Join(path, "_folder.json"))) khi tìm thấy trong f.index; nếu file hoặc _folder.json không còn tồn tại trên đĩa thì gọi f.IndexDelete(uuid) và thực hiện fallback walkFindUUID(collRoot, uuid) để tự chữa lành cache RAM. Cập nhật TestFindByUUID_IndexHit trong projects/storage/filesystem_test.go tạo file thật trên t.TempDir() trước khi gọi IndexSet.
    3. Trong projects/service/collection.go: thêm s.fs.IndexSet(req.ID, fullPath) vào buildRequestNode(fullPath string); trong GetTree(rootPath string) thay s.fs.IndexRebuild(rootPath) bằng s.fs.SetCollectionRoot(rootPath) và s.fs.IndexClear() để chỉ duyệt đĩa đúng 1 lần trong buildTree.
    4. Tạo projects/service/selector.go cung cấp ResolveCollectionSelector, ResolveEnvironmentSelector, ResolveFolderSelector và ResolveRequestSelector: luôn gọi fs.SetCollectionRoot(collRoot) ngay khi xác định được collection; hỗ trợ tra cứu bằng cả UUID lẫn tên/đường dẫn phân cấp tên (chuẩn hóa bỏ phần tử rỗng do dấu '/' ở đầu/cuối/lặp và ưu tiên khớp tên trực tiếp nếu thực thể chứa dấu '/'); đọc đầy đủ model.Request từ đĩa qua fs.ReadJSON(node.Path, &req) kèm pathFolders và allFolders; phát hiện và trả về lỗi VALIDATION kèm danh sách UUID khi trùng tên ở cùng một cấp.
    5. Viết đầy đủ unit tests trong projects/storage/filesystem_test.go (bao gồm self-healing khi xóa/move file và folder mất _folder.json) và projects/service/selector_test.go (sử dụng t.TempDir(), tuân thủ quy tắc an toàn dữ liệu test); đảm bảo 'go test ./...' pass 100%.

- id: "2"
  title: "Shared TypeScript Headless Execution Engine (headless-engine.js) & Pure-Go goja Runtime"
  description: >-
    Đóng gói bộ logic TypeScript của Frontend (4-Tier Variable Resolution, Auth Inheritance, Inherited Headers, buildExecuteRequest, Script Runner ha.*/pm.* và cURL Parser) thành bundle headless-engine.js (CAP-2).
    Xây dựng package Go hecto-api/engine nhúng headless-engine.js qua //go:embed và thực thi trên goja (pure Go JS engine) kèm cơ chế lưu cập nhật biến/auth từ script xuống đĩa (CAP-2).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    1. Tạo projects/frontend/src/utils/headless-engine.ts gom và xuất các hàm chuẩn từ resolveHierarchyVariables.ts, auth.ts, headers.ts, buildExecuteRequest.ts, scriptRunner.ts, curl.ts, urlParams.ts cùng 2 hàm điều phối prepareHeadlessExecution (đồng bộ hai chiều url/params/path_params như normalizeLoadedRequest, áp dụng cliVarOverrides, chạy pre-request script, áp dụng requestMutations cùng envUpdates/scopedEnvUpdates/scopedAuthUpdates có phân giải '__nearest__'/'__active__'/tên folder-env ngay trong bộ nhớ lên bản sao collection/environments/pathFolders/allFolders trước khi gọi buildExecuteRequest) và runHeadlessPostResponse (nhận các bản sao đã cập nhật từ bước pre-request).
    2. Cập nhật projects/frontend/package.json bổ sung script "build:headless" dùng 'bun build src/utils/headless-engine.ts --outfile ../engine/headless-engine.js --target browser --format iife --global-name HectoHeadless && mkdir -p dist && cp ../engine/headless-engine.js dist/headless-engine.js' và đặt vào trước 'vite build' trong script "build" ("vue-tsc --noEmit && bun run build:headless && vite build"). Chạy 'bun run build:headless' và giữ projects/engine/headless-engine.js được track trong Git (không đưa vào .gitignore).
    3. Bổ sung dependency github.com/dop251/goja vào projects/go.mod; tạo package projects/engine (projects/engine/headless.go) nhúng //go:embed headless-engine.js, cung cấp polyfills btoa (duyệt []rune(s) lấy byte(r) chuẩn Latin-1 cho r <= 0xFF để không làm hỏng UTF-8 từ TextEncoder), atob (chuyển từng byte giải mã thành rune(b)), TextEncoder, TextDecoder, console trên goja.Runtime.
    4. Hiện thực hóa trong projects/engine: struct RunOutput chuẩn (status_code, request, response, script_logs, script_error, env_updates), hàm ExecuteRequestFlow (chỉ gọi execSvc.SetTimeout khi TimeoutSec > 0; chạy Pre-request Script -> buildExecuteRequest -> ExecutorService.Send -> Post-response Script -> lưu envUpdates/scopedEnvUpdates/scopedAuthUpdates xuống collection.json, environments/<id>.json, _folder.json qua ApplyScriptUpdatesToDisk có phân giải '__nearest__'/'__active__'/tên folder-env trừ khi bật NoSaveEnv -> ghi HistoryService.RecordExecution) và hàm ParseCurl.
    5. Viết unit tests cho headless-engine.ts (Vitest) và projects/engine/headless_test.go (Go test với httptest.Server và t.TempDir() kiểm chứng đầy đủ 4-Tier Variables, Basic Auth ASCII & Unicode/tiếng Việt, Auth Inheritance, Pre/Post Script mutations & '__nearest__'/'__active__' scoped persistence); đảm bảo 'bun run type-check', 'bun run test', 'go test ./...' pass 100%.

- id: "3"
  title: "Standalone hecto CLI Binary, Orthogonal Command Matrix & hecto agent-guide"
  description: >-
    Xây dựng binary CLI độc lập hecto tại projects/cmd/hecto/main.go không phụ thuộc Wails/GTK (CAP-1), hỗ trợ cờ --json chuẩn model.Result và lệnh tự khám phá hecto agent-guide in nội dung SKILL.md ra stdout (CAP-3).
    Triển khai đầy đủ ma trận lệnh trực giao hecto <entity> <verb> cho collection, env, folder, req (create 1 bước, update Read-Merge-Write patch, delete, move) cùng các lệnh hecto run và hecto import (CAP-4).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    1. Tạo projects/cmd/hecto/SKILL.md chứa tài liệu hướng dẫn toàn diện cho AI Agent (frontmatter chuẩn, giải thích 4-Tier Variables, Auth Inheritance, ma trận lệnh, schema RunOutput, ví dụ mẫu) và nhúng qua //go:embed vào projects/cmd/hecto/.
    2. Tạo entrypoint projects/cmd/hecto/main.go và các file xử lý lệnh trong projects/cmd/hecto/: cấu hình slog.Logger với io.Discard (hoặc os.Stderr ở mức LevelError) để không làm bẩn stdout; hỗ trợ đặt cờ (--json, -c, --to, --set-var,...) ở cả trước và sau đối số vị trí <id|path>; hiển thị dòng gợi ý 'hecto agent-guide' ngay đầu 'hecto --help'; triển khai lệnh 'hecto agent-guide' in SKILL.md ra stdout; thiết lập fs.SetCollectionRoot(collRoot) ngay sau khi phân giải collection đích.
    3. Triển khai ma trận lệnh trực giao:
       - 'hecto collection list|get|create|update|delete|switch' (khi delete collection đang active thì tự động gọi ConfigService.SwitchActiveCollection(ctx, "default"))
       - 'hecto env list|get|create|update|delete|activate' (khi delete environment đang là active_env_id thì tự động xóa trắng active_env_id trong collection.json)
       - 'hecto folder list|tree|get|create|update|delete|move' (quản lý đầy đủ Variables tầng 3, FolderEnvs tầng 4, Headers, Auth, AuthEnvs; phân giải tên env trong --env-var/--set-env-var sang env.ID)
       - 'hecto req list|get|create|update|delete|move' (create 1 bước nhận đủ method/url/headers/params/path-params/body/auth/scripts; update thực hiện Read-Merge-Write patch qua FlagSet.Visit cho phép truyền "" để xóa trường và bảo toàn các trường không chỉ định; đồng bộ hai chiều url <-> params/path_params; chuẩn hóa --auth-type apikey thành 'apiKey'; hỗ trợ đọc @filepath cho body và script)
       - 'hecto run <id|path> [--env ...] [--var K=V]... [--timeout ...] [--no-save-env]'
       - 'hecto import <file-or-curl> [--folder ...] [--name ...]' (kiểm tra chuỗi bắt đầu bằng 'curl ', nếu không thì bắt buộc kiểm tra file tồn tại trên đĩa trước khi phân biệt JSON Postman v2.1 hay file cURL; hỗ trợ import vào --folder và ghi đè --name).
    4. Kiểm tra 'go list -deps ./cmd/hecto' đảm bảo không chứa github.com/wailsapp/wails/v2; viết bộ kiểm thử CLI toàn diện trong projects/cmd/hecto/main_test.go trên t.TempDir() (bao gồm kiểm thử cờ đặt sau đối số vị trí, xóa active env/active collection, --auth-type apikey, import file thiếu báo NOT_FOUND); đảm bảo 'go test ./...' và 'go build -o build/bin/hecto ./cmd/hecto' pass 100%.

- id: "4"
  title: "Wails External File Watcher (fsnotify) & UI Smart Data Reload Button"
  description: >-
    Tích hợp fsnotify watcher theo dõi thư mục Collection trên Wails Backend có cơ chế lọc self-write để phát hiện thay đổi từ CLI/bên ngoài và phát sự kiện collection:external-change lên Frontend (CAP-5).
    Bổ sung nút Reload dữ liệu riêng biệt kèm chấm báo hiệu trên AppSidebar.vue, phím tắt Ctrl+R/F5 trong App.vue và hành động collectionStore.smartReload() giữ nguyên expandedFolders, đồng bộ tabStore/FolderEditor.vue và bảo vệ tuyệt đối tab đang có thay đổi chưa lưu isDirty (CAP-5).
  spec_checkpoint: false
  done_checkpoint: false
  invoke_dev_with: >-
    1. Trong projects/storage/filesystem.go: bổ sung cơ chế ghi nhận thời điểm tự ghi (RecordSelfWrite / IsWithinSelfWriteWindow) gọi ở cả đầu hàm và defer cuối hàm trong WriteJSON, Delete, MoveFile, MakeDir (bỏ qua không ghi nhận self-write cho các đường dẫn trong .history/ hoặc config.json).
    2. Tạo projects/storage/watcher.go sử dụng fsnotify theo dõi đệ quy collRoot (tự động đăng ký đệ quy toàn bộ thư mục con mới khi nhận sự kiện Create/Rename thư mục, bỏ qua .tmp-*, .git, .history và lọc bỏ các sự kiện nằm trong cửa sổ tự ghi 400ms của Wails), debounce 300ms và tích hợp vào projects/app.go (startup, SwitchCollection, UpdateCollectionRoot) để emit sự kiện Wails 'collection:external-change'. Đồng thời trong App.ListCollections() và App.GetCollectionTree() (projects/app.go), kiểm tra cfg.ActiveCollection từ ConfigService để tự động đồng bộ lại a.activeCollection, a.collRoot và CollectionWatcher nếu CLI vừa chuyển hoặc xóa collection.
    3. Trong projects/frontend/src/stores/collectionStore.ts: thêm state hasExternalChanges (lắng nghe EventsOn('collection:external-change')) và action smartReload() chạy await Promise.all([this.loadCollections(), this.loadTree(), envStore.loadAll()]) rồi gọi tường minh await envStore.syncActiveEnvFromCollection(), bảo toàn các ID còn tồn tại trong expandedFolders, đồng bộ tabStore (đóng tab của thực thể đã bị xóa, cập nhật name/method cho tab còn sống, tự động loadRequest hoặc phát CustomEvent('hecto:folder-updated', { detail: { folderId: activeTab.entityId, reload: true } }) nếu activeTab có !isDirty, và bảo vệ không ghi đè kèm hiện toast cảnh báo nếu activeTab Request hoặc Folder có isDirty === true). Cập nhật projects/frontend/src/components/FolderEditor.vue (handleExternalFolderUpdated) gọi await loadFolderData() khi nhận sự kiện có detail.folderId === folder.value?.id && !isDirty.value.
    4. Trong projects/frontend/src/components/AppSidebar.vue: thêm nút Reload dữ liệu (data-test="sidebar-reload-btn") kèm chấm tròn báo hiệu (data-test="external-change-badge") khi store.hasExternalChanges === true, gọi store.smartReload() khi nhấn. Trong projects/frontend/src/App.vue (handleKeyDown dòng 61-65): thay window.location.reload() khi nhấn Ctrl+R / Cmd+R / F5 bằng void collectionStore.smartReload().
    5. Viết unit tests trong projects/storage/watcher_test.go, projects/app_test.go (đồng bộ active_collection từ đĩa) và cập nhật Vitest tests cho collectionStore.test.ts, AppSidebar.test.ts, FolderEditor.test.ts (nhận hecto:folder-updated với folderId) và kiểm thử phím tắt Ctrl+R / F5 gọi smartReload(); đảm bảo 'go test ./...', 'bun run type-check', 'bun run test' pass 100%.
